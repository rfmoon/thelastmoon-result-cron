name = "thelastmoon-result-cron"
main = "src/index.js"
compatibility_date = "2026-08-30"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[vars]
THELASTMOON_URL = "https://thelastmoon.pages.dev"
SOURCE_URL = "https://luna34849.com/history/number"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
